name: Publish Helm Charts

# Reports which repo secrets still authenticate. Never prints secret values.
on:
  push:
    branches:
      - 'test-*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LITEMAAS_URL: ${{ vars.LITEMAAS_URL }}
      LITEMAAS_API_KEY: ${{ secrets.LITEMAAS_API_KEY }}
      OC_SERVER: ${{ secrets.OC_SERVER }}
      OC_TOKEN: ${{ secrets.OC_TOKEN }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      SHOWROOM_OPENAI_API_KEY: ${{ secrets.SHOWROOM_OPENAI_API_KEY }}
      SHOWROOM_GEMINI_API_KEY: ${{ secrets.SHOWROOM_GEMINI_API_KEY }}
      SHOWROOM_PULL_SECRET: ${{ secrets.SHOWROOM_PULL_SECRET }}
      SHOWROOM_VLLM_API_TOKEN: ${{ secrets.SHOWROOM_VLLM_API_TOKEN }}
      SHOWROOM_VLLM_EMBEDDING_API_TOKEN: ${{ secrets.SHOWROOM_VLLM_EMBEDDING_API_TOKEN }}
    steps:
      - name: Check secrets
        shell: bash
        run: |
          set -uo pipefail
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          echo "| Secret | Status | Detail |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          row() {
            echo "$1: $2 ${3:-}"
            echo "| $1 | $2 | ${3:-} |" >> "$GITHUB_STEP_SUMMARY"
          }
          # Prints only the HTTP status code; response bodies are discarded.
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$@" || true; }
          status() {
            case "$1" in
              2??) echo VALID ;;
              401|403) echo REVOKED ;;
              000) echo UNREACHABLE ;;
              *) echo UNKNOWN ;;
            esac
          }
          http_check() {
            local name="$1"; shift
            local c; c=$(code "$@")
            row "$name" "$(status "$c")" "HTTP $c"
          }
          # Tries $url/models then $url/v1/models; first 2xx wins.
          models_check() {
            local name="$1" token="$2"; shift 2
            local url c last=000
            for url in "$@"; do
              [ -z "$url" ] && continue
              for path in /models /v1/models; do
                c=$(code -H "Authorization: Bearer $token" "${url%/}$path")
                last=$c
                [[ $c == 2?? ]] && { row "$name" VALID "HTTP $c"; return; }
              done
            done
            row "$name" "$(status "$last")" "HTTP $last"
          }
          docker_check() {
            local name="$1" registry="$2" user="$3" pass="$4"
            if printf '%s' "$pass" | docker login "$registry" -u "$user" --password-stdin >/dev/null 2>&1; then
              row "$name" VALID "$registry"
            else
              row "$name" "REVOKED" "$registry login failed"
            fi
          }
          set_or_skip() {
            [ -n "${!1:-}" ] && return 0
            row "$1" "NOT SET" ""; return 1
          }

          set_or_skip SHOWROOM_OPENAI_API_KEY && http_check SHOWROOM_OPENAI_API_KEY \
            -H "Authorization: Bearer $SHOWROOM_OPENAI_API_KEY" https://api.openai.com/v1/models
          set_or_skip SHOWROOM_GEMINI_API_KEY && http_check SHOWROOM_GEMINI_API_KEY \
            -H "x-goog-api-key: $SHOWROOM_GEMINI_API_KEY" https://generativelanguage.googleapis.com/v1beta/models

          set_or_skip LITEMAAS_API_KEY && models_check LITEMAAS_API_KEY "$LITEMAAS_API_KEY" "$LITEMAAS_URL"
          set_or_skip SHOWROOM_VLLM_API_TOKEN && models_check SHOWROOM_VLLM_API_TOKEN \
            "$SHOWROOM_VLLM_API_TOKEN" "$LITEMAAS_URL"
          set_or_skip SHOWROOM_VLLM_EMBEDDING_API_TOKEN && models_check SHOWROOM_VLLM_EMBEDDING_API_TOKEN \
            "$SHOWROOM_VLLM_EMBEDDING_API_TOKEN" "$LITEMAAS_URL"

          set_or_skip OC_TOKEN && http_check OC_TOKEN -k \
            -H "Authorization: Bearer $OC_TOKEN" "${OC_SERVER%/}/apis/user.openshift.io/v1/users/~"

          set_or_skip QUAY_PASSWORD && docker_check QUAY_PASSWORD quay.io "$QUAY_USERNAME" "$QUAY_PASSWORD"

          # Pull secret is a dockerconfigjson; check each registry entry.
          if set_or_skip SHOWROOM_PULL_SECRET; then
            if ! jq -e .auths >/dev/null 2>&1 <<<"$SHOWROOM_PULL_SECRET"; then
              row SHOWROOM_PULL_SECRET UNKNOWN "not a dockerconfigjson"
            else
              while read -r registry; do
                creds=$(jq -r --arg r "$registry" '.auths[$r].auth' <<<"$SHOWROOM_PULL_SECRET" | base64 -d 2>/dev/null)
                echo "::add-mask::${creds#*:}"
                if [ "$registry" = cloud.openshift.com ]; then
                  row "SHOWROOM_PULL_SECRET" SKIPPED "$registry (not a registry)"
                  continue
                fi
                docker_check SHOWROOM_PULL_SECRET "$registry" "${creds%%:*}" "${creds#*:}"
              done < <(jq -r '.auths | keys[]' <<<"$SHOWROOM_PULL_SECRET")
            fi
          fi

          {
            echo ""
            echo "Identifiers (not credentials, nothing to revoke): OC_SERVER, QUAY_USERNAME."
          } >> "$GITHUB_STEP_SUMMARY"
