name: Showroom Validation

on:
  push:
    branches:
      - ntsh
  # SECURITY: pull_request_target is used so that secrets are available for fork
  # PRs. This means the PR's code runs with access to repo secrets. Before
  # approving a workflow run from an outside contributor, carefully review ALL
  # changes to action.yml, scripts/, and any other executable content for
  # potential secret exfiltration.
  pull_request_target:
    branches:
      - main
  workflow_dispatch:
    inputs:
      catalog_image:
        description: 'OLM catalog image (optional)'
        required: false
        type: string
      ogx_image:
        description: 'OGX image (optional)'
        required: false
        type: string
      operator_image:
        description: 'Operator image (optional)'
        required: false
        type: string
jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: openshift-cluster-1
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup CI environment
        id: setup
        uses: ./
        with:
          catalog_image: ${{ inputs.catalog_image }}
          ogx_image: ${{ inputs.ogx_image }}
          operator_image: ${{ inputs.operator_image }}
          oc_server: ${{ secrets.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          env: |
            SHOWROOM_PULL_SECRET=${{ secrets.SHOWROOM_PULL_SECRET }}
            SHOWROOM_VLLM_URL=${{ vars.LITEMAAS_URL }}
            SHOWROOM_VLLM_API_TOKEN=${{ secrets.LITEMAAS_API_KEY }}
            SHOWROOM_INFERENCE_MODEL=${{ vars.LITEMAAS_INFERENCE_MODEL }}
            SHOWROOM_VLLM_EMBEDDING_URL=${{ vars.LITEMAAS_URL }}
            SHOWROOM_VLLM_EMBEDDING_API_TOKEN=${{ secrets.LITEMAAS_API_KEY }}
            SHOWROOM_EMBEDDING_MODEL=${{ vars.LITEMAAS_EMBEDDING_MODEL }}
            SHOWROOM_EMBEDDING_PROVIDER_MODEL_ID=${{ vars.LITEMAAS_EMBEDDING_MODEL }}
            SHOWROOM_OPENAI_API_KEY=${{ secrets.SHOWROOM_OPENAI_API_KEY }}
            SHOWROOM_GEMINI_API_KEY=${{ secrets.SHOWROOM_GEMINI_API_KEY }}

      - name: Run setup.sh
        run: |
          ${{ steps.setup.outputs.scripts_dir }}/setup.sh

      - name: Run provision.sh
        run: |
          ${{ steps.setup.outputs.scripts_dir }}/provision.sh

      - name: Start SSH debug session
        if: github.ref == 'refs/heads/ntsh'
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        timeout-minutes: 5
        env:
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
          SHOWROOM_PULL_SECRET: ${{ secrets.SHOWROOM_PULL_SECRET }}
        with:
          detached: true
          limit-access-to-actor: true
          tmate-server-host: '139.59.158.39'
          tmate-server-port: '2223'
          tmate-server-rsa-fingerprint: 'SHA256:nKfvTpzpXVMGwCK1vKDmFBCdKM+M/+eGMROyPScd7Es'
          tmate-server-ed25519-fingerprint: 'SHA256:4ZF/1X/oODYBo+w632wg1NDoe10HfsqvdCI4QGEZnkc'

      - name: Run tests
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/ntsh' ]]; then
            sleep 1800
            # Prevent tmate's post-job hook from waiting again.
            touch "$GITHUB_WORKSPACE/continue"
          fi
          ${{ steps.setup.outputs.scripts_dir }}/test.sh

      - name: Debug - Capture OpenShift state
        if: always()
        run: |
          # WARNING: Only output to stdout (console). Secrets are auto-redacted in console output
          # but NOT in files/artifacts. Be careful what you log in the application itself.

          echo -e "\n=== Recent Events ==="
          oc get events -n redhat-ods-applications --sort-by='.lastTimestamp' \
            -o custom-columns=TIME:.lastTimestamp,TYPE:.type,REASON:.reason,OBJECT:.involvedObject.name,MESSAGE:.message

          echo -e "\n=== All Resources ==="
          oc get all -n redhat-ods-applications

          echo -e "\n=== Pod Logs (last 50 lines) ==="
          oc logs -n redhat-ods-applications --tail=-1 -l app=ogx || echo "No logs available"

      - name: Run unprovision.sh
        if: always()
        run: |
          ${{ steps.setup.outputs.scripts_dir }}/unprovision.sh

      - name: Run cleanup.sh
        if: always()
        run: |
          ${{ steps.setup.outputs.scripts_dir }}/cleanup.sh
